<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wuxia AF-1 무현 기술 스프라이트</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#0a0f14;color:#dbe8ec;font-family:"Segoe UI",sans-serif}a{color:#73d4de}h1{font-size:1.5rem;margin:16px 0 6px}p{color:#81949b;margin:0 0 24px}.status{padding:14px 16px;background:#111a20;border:1px solid #293941;color:#a9bbc1;line-height:1.6}.status strong{color:#efb966}.sheets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}.sheet{width:100%;background:#172126;border:1px solid #293941}.motion{margin-top:28px}.motion h2{font-size:1rem;color:#efb966}.frames{display:grid;grid-template-columns:repeat(6,minmax(110px,1fr));gap:8px}.frame{background:#172126;border:1px solid #293941;padding:6px;text-align:center}.frame img{display:block;width:100%;aspect-ratio:1;object-fit:contain}.frame span{font-size:.72rem;color:#84979e}.active{border-color:#d59b42}@media(max-width:800px){.frames{grid-template-columns:repeat(3,1fr)}.sheets{grid-template-columns:1fr}}
</style>
</head>
<body>
<a href="index.html">← Wuxia 목업</a>
<h1>AF-1 무현 기술 스프라이트 · c04</h1>
<p>승인 기술 13종 · 156프레임 · 512×512 RGBA · pivot (256, 464)</p>
<div class="status"><strong>최신 재추출:</strong> Video Sprite Tool 전체 추출 + Quality V2 c04<br><strong>원본 계보:</strong> 7개 영상 · 1,327 fullframes · source SHA/PTS 보존<br><strong>품질 게이트:</strong> 승인 감사 42건 · override 15건 · 미해소 REVIEW 0<br><strong>검증:</strong> AD 모드2 APPROVED · QA PASS</div>
<div class="sheets" id="batchSheets"></div>
<main id="motions"></main>
<script>
const motions=[
  ['jeon_cham','전참'],['idan_cham','이단참'],['samdan_cham','삼단참'],['cham_jok','참족'],
  ['jeong_jok','정족'],['geom_jok','검족'],['geomjok_cham','검족참'],['cham_hyeon','참현'],
  ['jok_cham','족참'],['idan_jok','이단족'],['samdan_jok','삼단족'],['eum_sa','음사'],['ijung_eum','이중음']
];
const root=document.getElementById('motions');
for(const [id,name] of motions){const section=document.createElement('section');section.className='motion';section.innerHTML=`<h2>${name} · ${id}</h2><div class="frames"></div>`;const grid=section.querySelector('.frames');for(let i=0;i<12;i+=1){const card=document.createElement('div');card.className=`frame ${i>=4&&i<=6?'active':''}`;const index=String(i).padStart(3,'0');const phase=i<4?'STARTUP':i<7?'ACTIVE':'RECOVERY';card.innerHTML=`<img loading="lazy" src="assets/af1/${id}/${id}_${index}.png" alt="${name} ${phase} ${index}"><span>${phase} ${index}</span>`;grid.appendChild(card)}root.appendChild(section)}
const sheets=document.getElementById('batchSheets');
for(const [id,name] of motions){const image=document.createElement('img');image.className='sheet';image.loading='lazy';image.src=`assets/af1/batch4-contact-sheets/${id}-contact-sheet.png`;image.alt=`${name} c04 Quality V2 12프레임 콘택트 시트`;sheets.appendChild(image)}
</script>
</body>
</html>
